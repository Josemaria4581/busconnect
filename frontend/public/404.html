<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BusConnect</title>
    <script type="text/javascript">
      // Truco para que las rutas de React funcionen en GitHub Pages
      // Si GitHub da un 404, este script redirige la ruta a la raíz con un hash
      var segmentCount = 1; // Para /busconnect/ es 1
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/#/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
